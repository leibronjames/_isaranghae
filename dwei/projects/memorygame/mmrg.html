<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Memory Game - DWEI</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --black:#111111;
    --white:#ffffff;
    --pink:#f6d6de;
    --pink-dark:#ecb7c5;
    --gray:#6b6b6b;
    --light:#f7f7f7;
    --line:#e8e8e8;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    font-family:Arial, Helvetica, sans-serif;
    background:#eeeeee;
    color:var(--black);
    padding:22px;
}

button{
    font-family:inherit;
}

.game-container{
    width:min(1100px,100%);
    min-height:calc(100vh - 44px);
    margin:auto;
    background:var(--white);
    border-radius:28px;
    overflow:hidden;
    box-shadow:0 18px 50px rgba(0,0,0,.14);
}

.game-header{
    min-height:230px;
    padding:35px 42px;
    background:var(--black);
    color:var(--white);
    position:relative;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
}

.game-header::before{
    content:"";
    position:absolute;
    width:280px;
    height:280px;
    border-radius:50%;
    background:var(--pink);
    right:-90px;
    top:-130px;
}

.game-header::after{
    content:"";
    position:absolute;
    width:150px;
    height:150px;
    border:22px solid var(--pink);
    border-radius:50%;
    right:140px;
    bottom:-120px;
    opacity:.85;
}

.header-top{
    position:relative;
    z-index:2;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
}

.back-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    background:var(--white);
    color:var(--black);
    border:none;
    border-radius:999px;
    padding:11px 18px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

.back-btn:hover{
    background:var(--pink);
    transform:translateX(-4px);
}

.game-brand{
    font-size:1.3rem;
    font-weight:900;
    letter-spacing:3px;
}

.game-brand span{
    color:var(--pink);
}

.header-content{
    position:relative;
    z-index:2;
    margin-top:30px;
}

.header-badge{
    display:inline-block;
    background:var(--pink);
    color:var(--black);
    padding:8px 14px;
    border-radius:999px;
    font-size:.8rem;
    font-weight:bold;
    margin-bottom:15px;
}

.header-content h1{
    font-size:clamp(2.2rem,5vw,4rem);
    margin-bottom:12px;
}

.header-content p{
    color:#dddddd;
    line-height:1.7;
    max-width:620px;
}

.game-content{
    padding:34px 42px 42px;
}

.game-toolbar{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:16px;
    margin-bottom:28px;
}

.info-card{
    background:var(--light);
    border:1px solid var(--line);
    border-radius:20px;
    padding:18px 20px;
    text-align:center;
}

.info-label{
    color:var(--gray);
    font-size:.82rem;
    margin-bottom:7px;
    letter-spacing:1px;
}

.info-value{
    font-size:1.45rem;
    font-weight:900;
}

.restart-btn{
    width:100%;
    height:100%;
    min-height:75px;
    border:none;
    border-radius:20px;
    background:var(--pink);
    color:var(--black);
    font-size:1rem;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

.restart-btn:hover{
    background:var(--pink-dark);
    transform:translateY(-3px);
    box-shadow:0 10px 20px rgba(0,0,0,.1);
}

#board{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:14px;
    width:100%;
}

.card{
    aspect-ratio:1;
    perspective:900px;
    cursor:pointer;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
    transition:transform .25s ease;
}

.card:hover{
    transform:translateY(-4px);
}

.card.flip:hover,
.card.matched:hover{
    transform:none;
}

.inner{
    position:relative;
    width:100%;
    height:100%;
    transform-style:preserve-3d;
    transition:transform .5s cubic-bezier(.4,.2,.2,1);
}

.card.flip .inner{
    transform:rotateY(180deg);
}

.face{
    position:absolute;
    inset:0;
    border-radius:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
    box-shadow:0 9px 22px rgba(0,0,0,.09);
    overflow:hidden;
}

.back{
    background:var(--black);
    border:3px solid var(--black);
    color:var(--white);
}

.back::before{
    content:"";
    position:absolute;
    width:90px;
    height:90px;
    border-radius:50%;
    background:var(--pink);
    right:-30px;
    top:-35px;
}

.back::after{
    content:"?";
    position:relative;
    z-index:2;
    width:55px;
    height:55px;
    border-radius:16px;
    display:grid;
    place-items:center;
    background:var(--white);
    color:var(--black);
    font-size:1.8rem;
    font-weight:900;
}

.front{
    background:var(--white);
    border:3px solid var(--pink);
    transform:rotateY(180deg);
}

.front img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.card:hover .back{
    border-color:var(--pink-dark);
}

.card.matched .front{
    background:var(--pink);
    animation:matchedPulse .45s ease;
}

.card.matched{
    cursor:default;
}

@keyframes matchedPulse{
    0%{
        transform:rotateY(180deg) scale(1);
    }
    50%{
        transform:rotateY(180deg) scale(1.06);
    }
    100%{
        transform:rotateY(180deg) scale(1);
    }
}

#win{
    display:none;
    margin-top:28px;
    padding:28px;
    border-radius:24px;
    background:var(--black);
    color:var(--white);
    text-align:center;
    animation:winAppear .5s ease;
}

#win.show{
    display:block;
}

#win h2{
    font-size:2rem;
    margin-bottom:10px;
}

#win p{
    color:#dddddd;
    margin-bottom:18px;
    line-height:1.6;
}

.win-btn{
    border:none;
    border-radius:999px;
    padding:12px 22px;
    background:var(--pink);
    color:var(--black);
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

.win-btn:hover{
    background:var(--pink-dark);
    transform:translateY(-2px);
}

@keyframes winAppear{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:none;
    }
}

.footer{
    text-align:center;
    color:#888888;
    padding-top:30px;
    font-size:.9rem;
}

@media(max-width:800px){
    body{
        padding:14px;
    }

    .game-container{
        min-height:calc(100vh - 28px);
        border-radius:22px;
    }

    .game-header{
        padding:28px 24px;
    }

    .game-content{
        padding:25px 22px 32px;
    }

    #board{
        grid-template-columns:repeat(4,1fr);
        gap:11px;
    }

    .face{
        border-radius:16px;
    }
}

@media(max-width:550px){
    body{
        padding:0;
        background:var(--white);
    }

    html{
        -webkit-text-size-adjust:100%;
    }

    .game-container{
        min-height:100vh;
        border-radius:0;
        box-shadow:none;
    }

    .game-header{
        min-height:180px;
        padding:18px 16px 22px;
    }

    .header-top{
        align-items:flex-start;
    }

    .back-btn{
        padding:10px 14px;
    }

    .game-brand{
        font-size:1rem;
    }

    .game-content{
        padding:20px 14px 28px;
    }

    .game-toolbar{
        grid-template-columns:repeat(2,1fr);
        gap:12px;
    }

    .restart-wrap{
        grid-column:1 / -1;
    }

    .restart-btn{
        min-height:52px;
        font-size:1rem;
    }

    #board{
        grid-template-columns:repeat(4,1fr);
        gap:10px;
        padding:4px;
    }

    .card{
        min-height:78px;
    }

    .face{
        border-radius:12px;
    }

    .back{
        border-width:2px;
    }

    .front{
        border-width:2px;
    }

    .back::after{
        width:40px;
        height:40px;
        border-radius:12px;
        font-size:1.35rem;
    }
}

@media(max-width:370px){
    #board{
        gap:6px;
    }
}
</style>
</head>

<body>

<div class="game-container">

    <header class="game-header">

        <div class="header-top">

            <button
                class="back-btn"
                type="button"
                onclick="window.location.href='../projects.html'">
                ← Back
            </button>

            <div class="game-brand">
                DW<span>EI</span>
            </div>

        </div>

        <div class="header-content">
            <span class="header-badge">BROWSER GAME</span>

            <h1>Memory Card Game</h1>

            <p>
                Flip the cards, remember their positions and match all
                ten pairs as quickly as possible.
            </p>
        </div>

    </header>

    <main class="game-content">

        <section class="game-toolbar">

            <div class="info-card">
                <div class="info-label">TIME</div>
                <div class="info-value" id="timer">00:00</div>
            </div>

            <div class="info-card">
                <div class="info-label">MOVES</div>
                <div class="info-value" id="moves">0</div>
            </div>

            <div class="restart-wrap">
                <button
                    class="restart-btn"
                    type="button"
                    onclick="startGame()">
                    Restart Game
                </button>
            </div>

        </section>

        <div id="board"></div>

        <section id="win">
            <h2>You completed the game!</h2>
            <p id="winDetails"></p>

            <button
                class="win-btn"
                type="button"
                onclick="startGame()">
                Play Again
            </button>
        </section>

        <div class="footer">
            Designed and developed by Lei Andrei Deguzman
        </div>

    </main>

</div>

<script>
const icons = [
    "images/1.jpg",
    "images/2.jpg",
    "images/3.jpg",
    "images/4.jpg",
    "images/5.jpg",
    "images/6.jpg",
    "images/7.jpg",
    "images/8.jpg",
    "images/9.jpg",
    "images/10.jpg"
];

const board = document.getElementById("board");
const timerDisplay = document.getElementById("timer");
const movesDisplay = document.getElementById("moves");
const winBox = document.getElementById("win");
const winDetails = document.getElementById("winDetails");

let firstCard = null;
let secondCard = null;
let boardLocked = false;
let matchedCards = 0;
let elapsedTime = 0;
let moves = 0;
let timerInterval = null;
let timerStarted = false;

function formatTime(seconds){
    const minutes = Math.floor(seconds / 60);
    const remainingSeconds = seconds % 60;

    return (
        String(minutes).padStart(2, "0") +
        ":" +
        String(remainingSeconds).padStart(2, "0")
    );
}

function shuffleCards(array){
    for(let i = array.length - 1; i > 0; i--){
        const randomIndex = Math.floor(Math.random() * (i + 1));

        [array[i], array[randomIndex]] =
        [array[randomIndex], array[i]];
    }

    return array;
}

function beginTimer(){
    if(timerStarted) return;

    timerStarted = true;

    timerInterval = setInterval(() => {
        elapsedTime++;
        timerDisplay.textContent = formatTime(elapsedTime);
    }, 1000);
}

function createCard(imagePath){
    const card = document.createElement("div");

    card.className = "card";
    card.dataset.value = imagePath;

    card.innerHTML = `
        <div class="inner">
            <div class="face back"></div>
            <div class="face front">
                <img src="${imagePath}" alt="Memory card image">
            </div>
        </div>
    `;

    card.addEventListener("click", () => flipCard(card));

    return card;
}

function flipCard(card){
    if(
        boardLocked ||
        card === firstCard ||
        card.classList.contains("flip") ||
        card.classList.contains("matched")
    ){
        return;
    }

    beginTimer();

    card.classList.add("flip");

    if(!firstCard){
        firstCard = card;
        return;
    }

    secondCard = card;
    boardLocked = true;
    moves++;

    movesDisplay.textContent = moves;

    checkMatch();
}

function checkMatch(){
    const isMatch =
        firstCard.dataset.value === secondCard.dataset.value;

    if(isMatch){
        handleMatch();
    }else{
        handleMismatch();
    }
}

function handleMatch(){
    firstCard.classList.add("matched");
    secondCard.classList.add("matched");

    matchedCards += 2;

    resetTurn();

    if(matchedCards === icons.length * 2){
        finishGame();
    }
}

function handleMismatch(){
    setTimeout(() => {
        firstCard.classList.remove("flip");
        secondCard.classList.remove("flip");

        resetTurn();
    }, 850);
}

function resetTurn(){
    firstCard = null;
    secondCard = null;
    boardLocked = false;
}

function finishGame(){
    clearInterval(timerInterval);

    winDetails.textContent =
        `You matched all cards in ${formatTime(elapsedTime)} using ${moves} moves.`;

    winBox.classList.add("show");

    setTimeout(() => {
        winBox.scrollIntoView({
            behavior:"smooth",
            block:"center"
        });
    }, 300);
}

function startGame(){
    clearInterval(timerInterval);

    firstCard = null;
    secondCard = null;
    boardLocked = false;
    matchedCards = 0;
    elapsedTime = 0;
    moves = 0;
    timerStarted = false;

    timerDisplay.textContent = "00:00";
    movesDisplay.textContent = "0";

    winBox.classList.remove("show");
    board.innerHTML = "";

    const cardValues = shuffleCards([
        ...icons,
        ...icons
    ]);

    cardValues.forEach(imagePath => {
        board.appendChild(createCard(imagePath));
    });

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}

startGame();
</script>

</body>
</html>
