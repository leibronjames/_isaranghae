<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>New Genes Slot Machine - DWEI</title>


<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
    user-select:none;
}

:root{
    --black:#111111;
    --white:#ffffff;
    --pink:#f6d6de;
    --pink-dark:#e9b7c4;
    --light:#f7f7f7;
    --line:#e6e6e6;
    --gray:#707070;
}

html{
    -webkit-text-size-adjust:100%;
}

body{
    min-height:100vh;
    padding:20px;
    background:#ececec;
    color:var(--black);
}

button{
    font:inherit;
    -webkit-tap-highlight-color:transparent;
}

.slot-wrapper{
    width:min(1180px,100%);
    margin:auto;
    overflow:hidden;
    border-radius:28px;
    background:var(--white);
    box-shadow:0 18px 50px rgba(0,0,0,.14);
}

header{
    min-height:220px;
    position:relative;
    overflow:hidden;
    padding:32px 38px;
    background:var(--black);
    color:var(--white);
    display:flex;
    flex-direction:column;
    justify-content:space-between;
}

header::before{
    content:"";
    position:absolute;
    width:260px;
    height:260px;
    right:-95px;
    top:-125px;
    border-radius:50%;
    background:var(--pink);
}

header::after{
    content:"";
    position:absolute;
    width:145px;
    height:145px;
    right:145px;
    bottom:-110px;
    border:22px solid var(--pink);
    border-radius:50%;
}

.header-top,
.header-copy{
    position:relative;
    z-index:2;
}

.header-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:16px;
}

.back-btn{
    min-height:44px;
    padding:0 18px;
    border:none;
    border-radius:999px;
    background:var(--white);
    color:var(--black);
    font-size:14px;
    font-weight:800;
    cursor:pointer;
    transition:.2s;
}

.back-btn:hover{
    background:var(--pink);
    transform:translateX(-3px);
}

.brand{
    font-weight:900;
    letter-spacing:3px;
}

.brand span{
    color:var(--pink);
}

.header-copy{
    margin-top:28px;
}

.header-copy small{
    display:inline-block;
    margin-bottom:12px;
    padding:7px 12px;
    border-radius:999px;
    background:var(--pink);
    color:var(--black);
    font-size:12px;
    font-weight:800;
    letter-spacing:.8px;
}

.header-copy h1{
    font-size:clamp(2.3rem,6vw,4rem);
    line-height:1;
    margin-bottom:12px;
}

.header-copy p{
    max-width:620px;
    color:#d5d5d5;
    line-height:1.6;
}

.game-area{
    padding:34px 38px 40px;
}

.top-info{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:16px;
    margin-bottom:24px;
}

.info-card,
.stat-card{
    padding:18px;
    border:1px solid var(--line);
    border-radius:20px;
    background:var(--light);
    text-align:center;
    color:var(--gray);
    font-size:13px;
    font-weight:700;
    letter-spacing:.7px;
    text-transform:uppercase;
}

.info-card span,
.stat-card strong{
    display:block;
    margin-top:7px;
    color:var(--black);
    font-size:clamp(1.4rem,4vw,2rem);
    letter-spacing:0;
}

.machine-layout{
    display:grid;
    grid-template-columns:minmax(0,1fr) 120px;
    gap:24px;
    align-items:stretch;
    margin-bottom:24px;
}

.machine{
    padding:20px;
    border:1px solid var(--line);
    border-radius:26px;
    background:#fafafa;
}

.reels{
    display:grid;
    grid-template-columns:repeat(4,minmax(0,1fr));
    gap:14px;
}

.reel{
    aspect-ratio:4 / 5;
    min-height:170px;
    overflow:hidden;
    border:2px solid var(--line);
    border-radius:18px;
    background:var(--white);
    transition:border-color .2s ease,transform .2s ease;
}

.reel img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.reel.win{
    border-color:var(--pink-dark);
    transform:translateY(-3px);
}

/* PULL LEVER */

.lever-panel{
    min-height:100%;
    padding:16px 12px;
    border:1px solid var(--line);
    border-radius:24px;
    background:var(--light);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
}

.lever-label{
    margin-bottom:12px;
    color:var(--gray);
    font-size:11px;
    font-weight:800;
    letter-spacing:1px;
    text-transform:uppercase;
}

.lever-track{
    width:58px;
    height:220px;
    position:relative;
    border:2px solid var(--line);
    border-radius:999px;
    background:var(--white);
    touch-action:none;
}

.lever-stick{
    width:8px;
    height:142px;
    position:absolute;
    left:50%;
    top:28px;
    transform:translateX(-50%);
    border-radius:999px;
    background:var(--black);
    transform-origin:50% 100%;
    transition:transform .22s ease;
}

.lever-handle{
    width:46px;
    height:46px;
    position:absolute;
    left:50%;
    top:8px;
    transform:translateX(-50%);
    border:4px solid var(--black);
    border-radius:50%;
    background:var(--pink);
    cursor:grab;
    z-index:2;
    transition:top .2s ease,transform .15s ease;
}

.lever-handle:active{
    cursor:grabbing;
}

.lever-track.pulled .lever-stick{
    transform:translateX(-50%) rotate(18deg);
}

.lever-track.pulled .lever-handle{
    top:164px;
    transform:translateX(-50%) scale(.96);
}

.lever-help{
    margin-top:12px;
    color:var(--gray);
    font-size:11px;
    text-align:center;
    line-height:1.4;
}

.controls{
    display:grid;
    grid-template-columns:58px minmax(180px,1fr) 58px minmax(150px,.7fr);
    gap:12px;
    align-items:center;
    margin-bottom:18px;
}

.controls button{
    min-height:54px;
    border:none;
    border-radius:16px;
    background:var(--black);
    color:var(--white);
    font-size:16px;
    font-weight:900;
    cursor:pointer;
    transition:.2s;
}

.controls button:hover{
    transform:translateY(-2px);
}

.controls button:active{
    transform:scale(.97);
}

.controls button:disabled{
    opacity:.45;
    cursor:not-allowed;
    transform:none;
}

#spin{
    background:var(--pink);
    color:var(--black);
    font-size:20px;
}

#addCredits{
    background:#ededed;
    color:var(--black);
}

.message{
    min-height:44px;
    margin-bottom:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    font-size:clamp(1.1rem,3vw,1.6rem);
    font-weight:900;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:16px;
}

.coin{
    position:fixed;
    top:-40px;
    z-index:9999;
    pointer-events:none;
    font-size:24px;
    animation:coinFall 1.5s linear forwards;
}

@keyframes coinFall{
    to{
        transform:translateY(110vh) rotate(540deg);
        opacity:0;
    }
}

footer{
    padding:18px;
    border-top:1px solid var(--line);
    color:#888;
    text-align:center;
    font-size:13px;
}

@media(max-width:800px){
    body{
        padding:12px;
    }

    .slot-wrapper{
        border-radius:22px;
    }

    header{
        min-height:205px;
        padding:24px 22px;
    }

    .game-area{
        padding:24px 20px 30px;
    }

    .machine-layout{
        grid-template-columns:minmax(0,1fr) 92px;
        gap:14px;
    }

    .machine{
        padding:12px;
    }

    .reels{
        gap:8px;
    }

    .reel{
        min-height:110px;
        border-radius:13px;
    }

    .lever-track{
        width:50px;
        height:180px;
    }

    .lever-stick{
        height:112px;
    }

    .lever-handle{
        width:40px;
        height:40px;
    }

    .lever-track.pulled .lever-handle{
        top:132px;
    }

    .controls{
        grid-template-columns:54px 1fr 54px;
    }

    #addCredits{
        grid-column:1 / -1;
    }
}

@media(max-width:520px){
    body{
        padding:0;
        background:var(--white);
    }

    .slot-wrapper{
        min-height:100vh;
        border-radius:0;
        box-shadow:none;
    }

    header{
        min-height:190px;
        padding:18px 16px 22px;
    }

    .header-copy{
        margin-top:24px;
    }

    .game-area{
        padding:18px 12px 26px;
    }

    .top-info{
        gap:9px;
    }

    .info-card,
    .stat-card{
        padding:13px 8px;
        border-radius:15px;
        font-size:10px;
    }

    .machine-layout{
        grid-template-columns:minmax(0,1fr) 72px;
        gap:8px;
    }

    .machine{
        padding:8px;
        border-radius:18px;
    }

    .reels{
        gap:5px;
    }

    .reel{
        min-height:78px;
        border-width:1px;
        border-radius:10px;
    }

    .lever-panel{
        padding:8px 6px;
        border-radius:17px;
    }

    .lever-label{
        font-size:9px;
    }

    .lever-track{
        width:42px;
        height:145px;
    }

    .lever-stick{
        width:6px;
        height:88px;
        top:25px;
    }

    .lever-handle{
        width:34px;
        height:34px;
        top:7px;
        border-width:3px;
    }

    .lever-track.pulled .lever-handle{
        top:104px;
    }

    .lever-help{
        font-size:9px;
    }

    .controls{
        grid-template-columns:48px 1fr 48px;
        gap:8px;
    }

    .controls button{
        min-height:49px;
        border-radius:14px;
        font-size:14px;
    }

    #spin{
        font-size:17px;
    }

    .stats{
        gap:8px;
    }

    .message{
        min-height:40px;
        margin-bottom:14px;
    }
}
</style>

</head>

<body>

<div class="slot-wrapper">

<header>
    <div class="header-top">
        <button class="back-btn" onclick="window.location.href='../projects.html'">
            ← Back
        </button>

        <div class="brand">DW<span>EI</span></div>
    </div>

    <div class="header-copy">
        <small>BROWSER GAME</small>
        <h1>NEW GENES</h1>
        <p>Adjust your bet, pull the lever, and match the four reels.</p>
    </div>
</header>

<div class="game-area">

    <div class="top-info">
        <div class="info-card">
            Credits
            <span id="credits">1000</span>
        </div>

        <div class="info-card">
            Bet
            <span id="bet">10</span>
        </div>
    </div>

    <div class="machine-layout">

        <div class="machine">
            <div class="reels">
                <div class="reel"><img id="r1" src="img1.jpg" alt="Slot symbol"></div>
                <div class="reel"><img id="r2" src="img2.jpg" alt="Slot symbol"></div>
                <div class="reel"><img id="r3" src="img3.jpg" alt="Slot symbol"></div>
                <div class="reel"><img id="r4" src="img4.jpg" alt="Slot symbol"></div>
            </div>
        </div>

        <aside class="lever-panel">
            <div class="lever-label">Pull to spin</div>

            <div class="lever-track" id="leverTrack">
                <div class="lever-stick"></div>
                <button
                    class="lever-handle"
                    id="leverHandle"
                    type="button"
                    aria-label="Pull lever to spin">
                </button>
            </div>

            <div class="lever-help">Drag the handle down</div>
        </aside>

    </div>

    <div class="controls">
        <button id="minus" type="button">−</button>
        <button id="spin" type="button">SPIN</button>
        <button id="plus" type="button">+</button>
        <button id="addCredits" type="button">+1000 Credits</button>
    </div>

    <div class="message" id="message"></div>

    <div class="stats">
        <div class="stat-card">
            Spins
            <strong id="spins">0</strong>
        </div>

        <div class="stat-card">
            Wins
            <strong id="wins">0</strong>
        </div>

        <div class="stat-card">
            Biggest Win
            <strong id="big">0</strong>
        </div>
    </div>

</div>

<footer>© 2026 DWEI Portfolio</footer>

</div>

<script>
    const images = [
    "img1.jpg",
    "img2.jpg",
    "img3.jpg",
    "img4.jpg",
    "img5.jpg",
    "img6.jpg",
    "img7.jpg"
];

const weights = [28,23,18,13,9,6,3];
const payouts = [5,8,12,20,40,80,150];
const bets = [10,25,50,100,250];

let credits = 1000;
let betIndex = 0;
let spins = 0;
let wins = 0;
let biggestWin = 0;

const reels = [
    document.getElementById("r1"),
    document.getElementById("r2"),
    document.getElementById("r3"),
    document.getElementById("r4")
];

const spinButton = document.getElementById("spin");
const minus = document.getElementById("minus");
const plus = document.getElementById("plus");
const message = document.getElementById("message");
const addCredits = document.getElementById("addCredits");

addCredits.onclick=function(){
    credits += 1000;
    message.style.color="#198754";
    message.textContent="+1,000 Credits Added!";
    updateUI();
    saveData();
};


loadData();
updateUI();

function updateUI(){
    document.getElementById("credits").textContent = credits.toLocaleString();
    document.getElementById("bet").textContent = bets[betIndex].toLocaleString();
    document.getElementById("spins").textContent = spins.toLocaleString();
    document.getElementById("wins").textContent = wins.toLocaleString();
    document.getElementById("big").textContent = biggestWin.toLocaleString();
}

function saveData(){
    localStorage.setItem("fortuneCredits",credits);
    localStorage.setItem("fortuneBet",betIndex);
    localStorage.setItem("fortuneSpins",spins);
    localStorage.setItem("fortuneWins",wins);
    localStorage.setItem("fortuneBig",biggestWin);
}

function loadData(){
    credits = Number(localStorage.getItem("fortuneCredits")) || 1000;
    betIndex = Number(localStorage.getItem("fortuneBet")) || 0;
    spins = Number(localStorage.getItem("fortuneSpins")) || 0;
    wins = Number(localStorage.getItem("fortuneWins")) || 0;
    biggestWin = Number(localStorage.getItem("fortuneBig")) || 0;
}

function randomSymbol(){
    const total = weights.reduce((a,b)=>a+b,0);
    let random = Math.random()*total;

    for(let i=0;i<weights.length;i++){
        if(random < weights[i]){
            return i;
        }

        random -= weights[i];
    }

    return 0;
}

minus.onclick = function(){
    if(betIndex > 0){
        betIndex--;
        updateUI();
        saveData();
    }
};

plus.onclick = function(){
    if(betIndex < bets.length-1){
        betIndex++;
        updateUI();
        saveData();
    }
};

spinButton.onclick = spin;

function setControlsDisabled(disabled){
    spinButton.disabled = disabled;
    minus.disabled = disabled;
    plus.disabled = disabled;
}

function spin(){
    const bet = bets[betIndex];

    if(credits < bet){
        message.style.color = "#d11a2a";
        message.textContent = "Not enough credits!";
        return;
    }

    credits -= bet;
    spins++;

    updateUI();
    saveData();
    setControlsDisabled(true);

    message.textContent = "";

    reels.forEach(reel=>{
        reel.parentElement.classList.remove("win");
    });

    const results = [];
    let finished = 0;

    reels.forEach((reel,index)=>{
        let counter = 0;

        const animation = setInterval(()=>{
            reel.src = images[Math.floor(Math.random()*images.length)];
            counter++;

            if(counter > 15 + index*8){
                clearInterval(animation);

                const finalSymbol = randomSymbol();
                results[index] = finalSymbol;
                reel.src = images[finalSymbol];
                finished++;

                if(finished === 4){
                    checkResult(results);
                }
            }
        },80);
    });
}

function checkResult(results){
    const bet = bets[betIndex];
    const counts = {};

    results.forEach(symbol=>{
        counts[symbol] = (counts[symbol] || 0) + 1;
    });

    let bestSymbol = -1;
    let highest = 0;

    for(const symbol in counts){
        if(counts[symbol] > highest){
            highest = counts[symbol];
            bestSymbol = Number(symbol);
        }
    }

    let reward = 0;

    if(highest === 4){
        reward = bet * payouts[bestSymbol];
        message.style.color = "#198754";
        message.textContent = "JACKPOT! +" + reward.toLocaleString();
        createCoins(30);
    }
    else if(highest === 3){
        reward = bet * 3;
        message.style.color = "#b8860b";
        message.textContent = "BIG WIN! +" + reward.toLocaleString();
        createCoins(15);
    }
    else if(highest === 2){
        reward = bet;
        message.style.color = "#333";
        message.textContent = "BET RETURNED";
    }
    else{
        message.style.color = "#d11a2a";
        message.textContent = "Try Again!";
    }

    if(reward > 0){
        credits += reward;
        wins++;

        if(reward > biggestWin){
            biggestWin = reward;
        }

        reels.forEach((reel,index)=>{
            if(results[index] === bestSymbol){
                reel.parentElement.classList.add("win");
            }
        });
    }

    updateUI();
    saveData();

    setTimeout(()=>{
        reels.forEach(reel=>{
            reel.parentElement.classList.remove("win");
        });

        setControlsDisabled(false);
    },1200);
}

function createCoins(amount){
    for(let i=0;i<amount;i++){
        const coin = document.createElement("div");

        coin.className = "coin";
        coin.textContent = "●";
        coin.style.left = Math.random()*100 + "vw";
        coin.style.animationDelay = Math.random()*0.4 + "s";

        document.body.appendChild(coin);

        setTimeout(()=>{
            coin.remove();
        },2200);
    }
}

// ======================================
// PULL LEVER
// ======================================

const leverTrack = document.getElementById("leverTrack");
const leverHandle = document.getElementById("leverHandle");

let leverDragging = false;
let leverStartY = 0;
let leverDistance = 0;

function pullLeverAndSpin(){
    if(spinButton.disabled) return;

    leverTrack.classList.add("pulled");

    setTimeout(() => {
        spin();
    }, 150);

    setTimeout(() => {
        leverTrack.classList.remove("pulled");
    }, 520);
}

function beginLeverDrag(clientY){
    if(spinButton.disabled) return;

    leverDragging = true;
    leverStartY = clientY;
    leverDistance = 0;
}

function moveLeverDrag(clientY){
    if(!leverDragging) return;

    leverDistance = Math.max(0, clientY - leverStartY);

    if(leverDistance > 18){
        leverTrack.classList.add("pulled");
    }
}

function endLeverDrag(){
    if(!leverDragging) return;

    leverDragging = false;

    if(leverDistance >= 45){
        pullLeverAndSpin();
    }else{
        leverTrack.classList.remove("pulled");
    }

    leverDistance = 0;
}

leverHandle.addEventListener("pointerdown", event => {
    event.preventDefault();
    leverHandle.setPointerCapture(event.pointerId);
    beginLeverDrag(event.clientY);
});

leverHandle.addEventListener("pointermove", event => {
    moveLeverDrag(event.clientY);
});

leverHandle.addEventListener("pointerup", endLeverDrag);
leverHandle.addEventListener("pointercancel", endLeverDrag);

leverHandle.addEventListener("click", event => {
    event.preventDefault();

    if(leverDistance === 0){
        pullLeverAndSpin();
    }
});

</script>

</body>
</html>
