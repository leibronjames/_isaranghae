<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Resume Builder Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
@page{size:A4;margin:10mm}*{box-sizing:border-box}body{font-family:Poppins,sans-serif;background:#eef2f7;margin:0;padding:20px}
.toolbar{text-align:center;margin-bottom:15px}.toolbar button{padding:10px 16px;margin:4px;border:0;border-radius:8px;background:#1f4e79;color:#fff;cursor:pointer}
.resume{width:210mm;min-height:297mm;margin:auto;background:#fff;display:grid;grid-template-columns:32% 68%;border-radius:12px;overflow:hidden;box-shadow:0 10px 25px rgba(0,0,0,.15)}
.left{background:#f8fafc;padding:22px}.right{padding:24px}.photo{width:170px;height:170px;border-radius:50%;overflow:hidden;border:5px solid #1f4e79;margin:auto}.photo img{width:100%;height:100%;object-fit:cover}
.section{margin-top:18px}.section h3{border-bottom:2px solid #1f4e79;color:#1f4e79}
[contenteditable]{display:block;padding:4px;border-radius:4px}[contenteditable]:focus{outline:2px solid #4da3ff;background:#fff8c4}
.skill{display:inline-block;background:#1f4e79;color:#fff;padding:6px 12px;border-radius:15px;margin:4px}
.card{background:#f8fafc;border-left:4px solid #1f4e79;padding:10px;margin:10px 0}
@media print{.toolbar,input{display:none!important}body{padding:0;background:#fff}.resume{box-shadow:none;width:100%;border-radius:0}}
</style></head><body>
<div class="toolbar"><button onclick="history.back()">← Back</button><button onclick="window.print()">🖨 Print</button><button onclick="downloadPDF()">📄 Download PDF</button><button onclick="downloadHTML()">💾 Download HTML</button><br><input id="up" type="file" accept="image/*"></div>
<div class="resume" id="resume"><div class="left"><div class="photo"><img id="img" src="https://via.placeholder.com/170"></div>
<div class="section"><h3>Contact</h3><p contenteditable>📧 Email</p><p contenteditable>📱 Phone</p><p contenteditable>📍 Address</p><p contenteditable>🌐 GitHub</p></div>
<div class="section"><h3>Skills</h3><div class="skill" contenteditable>HTML</div><div class="skill" contenteditable>CSS</div><div class="skill" contenteditable>JavaScript</div></div></div>
<div class="right"><h1 contenteditable>YOUR NAME</h1><h2 contenteditable>Job Title</h2><div class="section"><h3>Summary</h3><p contenteditable>Write your summary...</p></div><div class="section"><h3>Experience</h3><div class="card"><strong contenteditable>Position</strong><p contenteditable>Company | Year</p><p contenteditable>Responsibilities...</p></div></div><div class="section"><h3>Education</h3><div class="card"><strong contenteditable>School</strong><p contenteditable>Degree</p></div></div><div class="section"><h3>Projects</h3><div class="card"><strong contenteditable>Project</strong><p contenteditable>Description...</p></div></div></div></div>
<script>
up.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=x=>img.src=x.target.result;r.readAsDataURL(f)}
document.querySelectorAll("[contenteditable]").forEach((el,i)=>{let k="f"+i;el.innerHTML=localStorage.getItem(k)||el.innerHTML;el.oninput=()=>localStorage.setItem(k,el.innerHTML);});
function downloadHTML(){const b=new Blob([document.documentElement.outerHTML],{type:'text/html'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='resume_builder_pro.html';a.click();}
function downloadPDF(){html2pdf().set({filename:'Resume.pdf',margin:0,image:{type:'jpeg',quality:1},html2canvas:{scale:2},jsPDF:{unit:'mm',format:'a4'}}).from(document.getElementById('resume')).save();}
</script></body></html>
