<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Lucky Fortune</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
    user-select:none;
}

body{
    background:#ececec;
    min-height:100vh;
    padding:20px;
    color:#222;
}

.slot-wrapper{
    max-width:1200px;
    margin:auto;
    background:#fff;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 15px 40px rgba(0,0,0,.15);
}

header{
    position:relative;
    background:#000;
    color:#fff;
    padding:25px;
    text-align:center;
}

header h1{
    font-size:36px;
}

.back-btn{
    position:absolute;
    top:18px;
    left:20px;
    background:#fff;
    color:#000;
    border:none;
    padding:10px 16px;
    border-radius:10px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
    transition:.2s;
}

.back-btn:hover{
    background:#f8dbdf;
    color:#fff;
}

.game-area{
    padding:35px;
}

.top-info{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:20px;
    margin-bottom:25px;
}

.info-card{
    background:#f8f8f8;
    border-radius:18px;
    padding:20px;
    text-align:center;
}

.info-card span{
    display:block;
    margin-top:8px;
    font-size:30px;
    font-weight:bold;
}

.reels{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
    margin-bottom:25px;
}

.reel{
    height:220px;
    background:#f8f8f8;
    border:1px solid #e0e0e0;
    border-radius:18px;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    box-shadow:0 6px 18px rgba(0,0,0,.08);
    transition:.2s;
}

.reel img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.controls{
    display:flex;
    justify-content:center;
    gap:15px;
    flex-wrap:wrap;
    margin-bottom:20px;
}

button{
    border:none;
    background:#000;
    color:#fff;
    padding:14px 24px;
    border-radius:12px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    transition:.2s;
}

button:hover{
    transform:translateY(-2px);
    background:#333;
}

button:disabled{
    opacity:.5;
    cursor:not-allowed;
    transform:none;
}

#spin{
    min-width:240px;
    font-size:28px;
    padding:18px 40px;
}

.message{
    min-height:45px;
    font-size:28px;
    font-weight:bold;
    text-align:center;
    margin-bottom:20px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}

.stat-card{
    background:#f8f8f8;
    border-radius:18px;
    padding:20px;
    text-align:center;
}

.stat-card strong{
    display:block;
    font-size:28px;
    margin-top:8px;
}

.glow{
    outline:4px solid #f8dbdf;
    box-shadow:0 0 0 6px rgba(248,219,223,.35);
}

.coin{
    position:fixed;
    top:-40px;
    font-size:28px;
    pointer-events:none;
    animation:coinFall 1.8s linear forwards;
    z-index:9999;
}

@keyframes coinFall{
    to{
        transform:translateY(110vh) rotate(720deg);
        opacity:0;
    }
}

footer{
    text-align:center;
    padding:15px;
    color:#777;
    border-top:1px solid #eee;
}

@media(max-width:768px){
    body{
        padding:10px;
    }

    header{
        padding:22px 15px 20px;
    }

    header h1{
        font-size:28px;
        margin-top:40px;
    }

    .back-btn{
        top:15px;
        left:15px;
    }

    .game-area{
        padding:20px;
    }

    .reels{
        gap:10px;
    }

    .reel{
        height:100px;
        border-radius:12px;
    }

    .top-info,
    .stats{
        gap:10px;
    }

    .info-card,
    .stat-card{
        padding:15px 10px;
    }

    .info-card span,
    .stat-card strong{
        font-size:22px;
    }

    .message{
        font-size:22px;
    }

    button{
        font-size:16px;
        padding:12px 18px;
    }
}

@media(max-width:480px){
    .reels{
        gap:6px;
    }

    .reel{
        height:78px;
    }

    .top-info,
    .stats{
        grid-template-columns:1fr;
    }

    #spin{
        min-width:145px;
    }
}
</style>
</head>

<body>

<div class="slot-wrapper">

<header>
    <button class="back-btn" onclick="window.location.href='../projectdash.html'">
        ← Back
    </button>

    <h1>NEW GENES</h1>
</header>

<div class="game-area">

    <div class="top-info">
        <div class="info-card">
            Credits
            <span id="credits">1000</span>
        </div>

        <div class="info-card">
            Bet
            <span id="bet">10</span>
        </div>
    </div>

    <div class="reels">
        <div class="reel"><img id="r1" src="img1.jpg" alt="Slot symbol"></div>
        <div class="reel"><img id="r2" src="img2.jpg" alt="Slot symbol"></div>
        <div class="reel"><img id="r3" src="img3.jpg" alt="Slot symbol"></div>
        <div class="reel"><img id="r4" src="img4.jpg" alt="Slot symbol"></div>
    </div>

    <div class="controls">
        <button id="minus">−</button>
        <button id="spin">🎰 SPIN</button>
        <button id="plus">+</button>
        <button id="addCredits">+1000 Credits</button>
    </div>

    <div class="message" id="message"></div>

    <div class="stats">
        <div class="stat-card">
            Spins
            <strong id="spins">0</strong>
        </div>

        <div class="stat-card">
            Wins
            <strong id="wins">0</strong>
        </div>

        <div class="stat-card">
            Biggest Win
            <strong id="big">0</strong>
        </div>
    </div>

</div>

<footer>© 2026 DWEI Portfolio</footer>

</div>

<script>
    const images = [
    "img1.jpg",
    "img2.jpg",
    "img3.jpg",
    "img4.jpg",
    "img5.jpg",
    "img6.jpg",
    "img7.jpg"
];

const weights = [28,23,18,13,9,6,3];
const payouts = [5,8,12,20,40,80,150];
const bets = [10,25,50,100,250];

let credits = 1000;
let betIndex = 0;
let spins = 0;
let wins = 0;
let biggestWin = 0;

const reels = [
    document.getElementById("r1"),
    document.getElementById("r2"),
    document.getElementById("r3"),
    document.getElementById("r4")
];

const spinButton = document.getElementById("spin");
const minus = document.getElementById("minus");
const plus = document.getElementById("plus");
const message = document.getElementById("message");
const addCredits = document.getElementById("addCredits");

addCredits.onclick=function(){
    credits += 1000;
    message.style.color="#198754";
    message.textContent="+1,000 Credits Added!";
    updateUI();
    saveData();
};


loadData();
updateUI();

function updateUI(){
    document.getElementById("credits").textContent = credits.toLocaleString();
    document.getElementById("bet").textContent = bets[betIndex].toLocaleString();
    document.getElementById("spins").textContent = spins.toLocaleString();
    document.getElementById("wins").textContent = wins.toLocaleString();
    document.getElementById("big").textContent = biggestWin.toLocaleString();
}

function saveData(){
    localStorage.setItem("fortuneCredits",credits);
    localStorage.setItem("fortuneBet",betIndex);
    localStorage.setItem("fortuneSpins",spins);
    localStorage.setItem("fortuneWins",wins);
    localStorage.setItem("fortuneBig",biggestWin);
}

function loadData(){
    credits = Number(localStorage.getItem("fortuneCredits")) || 1000;
    betIndex = Number(localStorage.getItem("fortuneBet")) || 0;
    spins = Number(localStorage.getItem("fortuneSpins")) || 0;
    wins = Number(localStorage.getItem("fortuneWins")) || 0;
    biggestWin = Number(localStorage.getItem("fortuneBig")) || 0;
}

function randomSymbol(){
    const total = weights.reduce((a,b)=>a+b,0);
    let random = Math.random()*total;

    for(let i=0;i<weights.length;i++){
        if(random < weights[i]){
            return i;
        }

        random -= weights[i];
    }

    return 0;
}

minus.onclick = function(){
    if(betIndex > 0){
        betIndex--;
        updateUI();
        saveData();
    }
};

plus.onclick = function(){
    if(betIndex < bets.length-1){
        betIndex++;
        updateUI();
        saveData();
    }
};

spinButton.onclick = spin;

function setControlsDisabled(disabled){
    spinButton.disabled = disabled;
    minus.disabled = disabled;
    plus.disabled = disabled;
}

function spin(){
    const bet = bets[betIndex];

    if(credits < bet){
        message.style.color = "#d11a2a";
        message.textContent = "Not enough credits!";
        return;
    }

    credits -= bet;
    spins++;

    updateUI();
    saveData();
    setControlsDisabled(true);

    message.textContent = "";

    reels.forEach(reel=>{
        reel.parentElement.classList.remove("glow");
    });

    const results = [];
    let finished = 0;

    reels.forEach((reel,index)=>{
        let counter = 0;

        const animation = setInterval(()=>{
            reel.src = images[Math.floor(Math.random()*images.length)];
            counter++;

            if(counter > 15 + index*8){
                clearInterval(animation);

                const finalSymbol = randomSymbol();
                results[index] = finalSymbol;
                reel.src = images[finalSymbol];
                finished++;

                if(finished === 4){
                    checkResult(results);
                }
            }
        },80);
    });
}

function checkResult(results){
    const bet = bets[betIndex];
    const counts = {};

    results.forEach(symbol=>{
        counts[symbol] = (counts[symbol] || 0) + 1;
    });

    let bestSymbol = -1;
    let highest = 0;

    for(const symbol in counts){
        if(counts[symbol] > highest){
            highest = counts[symbol];
            bestSymbol = Number(symbol);
        }
    }

    let reward = 0;

    if(highest === 4){
        reward = bet * payouts[bestSymbol];
        message.style.color = "#198754";
        message.textContent = "🎉 JACKPOT! +" + reward.toLocaleString();
        createCoins(30);
    }
    else if(highest === 3){
        reward = bet * 3;
        message.style.color = "#b8860b";
        message.textContent = "⭐ BIG WIN! +" + reward.toLocaleString();
        createCoins(15);
    }
    else if(highest === 2){
        reward = bet;
        message.style.color = "#333";
        message.textContent = "🙂 BET RETURNED";
    }
    else{
        message.style.color = "#d11a2a";
        message.textContent = "Try Again!";
    }

    if(reward > 0){
        credits += reward;
        wins++;

        if(reward > biggestWin){
            biggestWin = reward;
        }

        reels.forEach((reel,index)=>{
            if(results[index] === bestSymbol){
                reel.parentElement.classList.add("glow");
            }
        });
    }

    updateUI();
    saveData();

    setTimeout(()=>{
        reels.forEach(reel=>{
            reel.parentElement.classList.remove("glow");
        });

        setControlsDisabled(false);
    },1200);
}

function createCoins(amount){
    for(let i=0;i<amount;i++){
        const coin = document.createElement("div");

        coin.className = "coin";
        coin.textContent = "🪙";
        coin.style.left = Math.random()*100 + "vw";
        coin.style.animationDelay = Math.random()*0.4 + "s";

        document.body.appendChild(coin);

        setTimeout(()=>{
            coin.remove();
        },2200);
    }
}
</script>

</body>
</html>
