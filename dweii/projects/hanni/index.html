<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

<title>Dino Runner</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
    user-select:none;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
    padding:0;
    overflow:hidden;
    touch-action:none;
    overscroll-behavior:none;
   
    -webkit-touch-callout:none;
    -webkit-text-size-adjust:100%;
}

body{
    background:url("bg.jpg") center/cover no-repeat;
    background-position:center;
    background-size:cover;
}

#game{
    width:100vw;
    height:100vh;
    position:relative;
    overflow:hidden;
}


/* TOP BAR */

#topbar{
    position:absolute;
    top:15px;
    left:50%;
    transform:translateX(-50%);
    width:95%;
    display:flex;
    justify-content:center;
    z-index:100;
}


.panel{
    display:flex;
    gap:12px;
}


.box{

    background:rgba(0,0,0,.55);
    color:white;

    padding:15px 22px;
    border-radius:20px;

    font-size:22px;
    font-weight:bold;

    backdrop-filter:blur(8px);

}



/* BUTTONS */

#buttons{

    position:absolute;
    right:20px;
    top:90px;

    display:flex;
    flex-direction:column;

    gap:12px;

    z-index:100;

}


#buttons button{

    width:70px;
    height:70px;

    border:none;
    border-radius:50%;

    background:#007BFF;

    color:white;

    font-size:32px;

}



/* PLAYER */

#player{

    position:absolute;

    left:70px;
    bottom:40px;

    width:120px;

    height:auto;

}



/* OBSTACLE */

#obs,
#obs2{

    position:absolute;

    left:100%;

    bottom:40px;

    width:100px;

}

#obs2{
    display:none;
}



/* GAME OVER */

#msg{

    position:absolute;

    inset:0;

    display:none;

    justify-content:center;

    align-items:center;

    flex-direction:column;

    background:rgba(0,0,0,.7);

    color:white;

    font-size:45px;

    z-index:500;

}



#restartBtn{

    margin-top:25px;

    padding:15px 35px;

    border:none;

    border-radius:15px;

    background:#007BFF;

    color:white;

    font-size:22px;

}



/* POPUPS */


.popup{

    position:absolute;

    top:50%;
    left:50%;

    transform:translate(-50%,-50%);

    width:380px;

    max-width:90%;

    padding:30px;

    background:white;

    border-radius:25px;

    display:none;

    z-index:700;

}



.popup h2{

    text-align:center;

    margin-bottom:20px;

}



.grid{

    display:grid;

    grid-template-columns:repeat(2,1fr);

    gap:15px;

}



.item{

    padding:15px;

    border:3px solid #ddd;

    border-radius:15px;

    text-align:center;

    font-size:20px;

}



.item img{

    width:100px;

}



/* MOBILE */


@media(max-width:700px){


#player{

    width:100px;

    left:25px;

}


#obs,
#obs2{

    width:85px;

}


.box{

    font-size:16px;

    padding:12px 15px;

}



#buttons{

    top:auto;

    bottom:20px;

    right:20px;

    flex-direction:row;

}



#buttons button{

    width:60px;

    height:60px;

    font-size:28px;

}


.popup{

    width:90%;

}


}
#startMenu button{
    margin-top:15px;
}

#playerName{
    width:min(320px,85vw);
    margin-top:20px;
    padding:14px 18px;
    border:none;
    border-radius:14px;
    outline:none;
    font-size:20px;
    text-align:center;
    user-select:text;
}

#leaderList{
    max-height:300px;
    overflow-y:auto;
    line-height:1.8;
}

#closeLeader{
    width:100%;
    margin-top:18px;
    padding:12px;
    border:none;
    border-radius:12px;
    background:#ff4757;
    color:white;
    font-size:18px;
}
#startMenu{

position:absolute;

inset:0;

display:flex;

justify-content:center;

align-items:center;

flex-direction:column;

background:rgba(0,0,0,.6);

color:white;

z-index:600;

font-size:40px;

}


#startMenu button{

margin-top:30px;

padding:15px 40px;

border:none;

border-radius:15px;

font-size:25px;

background:#007BFF;

color:white;

position:relative;

z-index:800;

}

#closeMsg{

    margin-top:15px;

    padding:15px 40px;

    border:none;

    border-radius:20px;

    background:#ff4757;

    color:white;

    font-size:22px;

    font-weight:bold;

    cursor:pointer;

    box-shadow:0 5px 15px rgba(0,0,0,.3);

    transition:.2s;

}


#closeMsg:active{

    transform:scale(.9);

}

html,body{
    touch-action:none;
    overscroll-behavior:none;
}

#player{
    animation: run 0.25s infinite alternate;
}

@keyframes run{

from{
    transform:translateY(0);
}

to{
    transform:translateY(-5px);
}

}

#newRecord{

    margin-top:15px;

    font-size:25px;

    color:gold;

}

.back-btn{
    position:absolute;
    top:20px;
    left:20px;
    padding:12px 22px;
    background:#007BFF;
    color:#fff;
    border:none;
    border-radius:15px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    z-index:999;
    box-shadow:0 5px 15px rgba(0,0,0,.3);
    transition:.25s;
}

.back-btn:hover{
    background:#0056b3;
    transform:translateY(-2px);
}

.back-btn:active{
    transform:scale(.95);
}

@media(max-width:700px){
    .back-btn{
        top:10px;
        left:10px;
        padding:10px 16px;
        font-size:16px;
    }
}

</style>

</head>


<body>


<div id="game">

<button class="back-btn" onclick="window.location.href='../projectdash.html'">
    ← Back
</button>


<!-- SCORE -->
<div id="startMenu">


<h1>🦖 DINO RUNNER</h1>

<input id="playerName" maxlength="15" placeholder="Enter Your Name" required>

<button id="startBtn">
▶️ START
</button>

<button id="startSkinBtn">
👕 SKIN
</button>

<button id="startBgBtn">
🖼️ BACKGROUND
</button>

<button id="leaderBtn">
🏆 LEADERBOARD
</button>

</div>

<div id="topbar">

<div class="panel">


<div class="box">
🏆 <span id="highScore">0</span>
</div>


<div class="box">
⭐ <span id="score">0</span>
</div>


<div class="box">
🪙 <span id="coins">0</span>
</div>


</div>

</div>

<!-- BUTTONS -->

<div id="buttons">

<button id="pauseBtn">⏸</button>

</div>

<!-- GAME OBJECTS -->

<img id="player" src="ha.png">

<img id="obs" src="hy.png" alt="Obstacle">
<img id="obs2" src="hy.png" alt="Second obstacle">

<!-- GAME OVER -->

<div id="msg">

<div id="gameOverText">GAME OVER</div>

<div id="newRecord" style="display:none;">
🏆 NEW HIGH SCORE!
</div>

<button id="restartBtn">
PLAY AGAIN
</button>


<button id="closeMsg">
🏠 MENU
</button>

</div>

<!-- SKIN MENU -->


<div id="skinMenu" class="popup">


<h2>👕 SKINS</h2>

<div class="grid">


<div class="item" data-skin="ha.png">

<img src="ha.png">

<p>Default</p>

</div>



<div class="item" data-skin="haerin.png">

<img src="haerin.png">

<p>Skin 2</p>

</div>



<div class="item" data-skin="minji.png">

<img src="minji.png">

<p>Skin 3</p>

</div>



<div class="item" data-skin="danielle.png">

<img src="danielle.png">

<p>Skin 4</p>

</div>

<div class="item" data-skin="hyein.png">

<img src="hyein.png">

<p>Skin 4</p>

</div>


</div>


</div>





<!-- BACKGROUND MENU -->


<div id="bgMenu" class="popup">

<h2>🖼️ BACKGROUNDS</h2>

<div class="grid">


<div class="item" data-bg="bg.jpg">

☀️
<br>
Sunny

</div>



<div class="item" data-bg="bg2.jpg">

❄️
<br>
Snow

</div>


</div>

</div>

<!-- LEADERBOARD MENU -->

<div id="leaderMenu" class="popup">

<h2>🏆 LEADERBOARD</h2>


<div id="leaderList">

Loading...

</div>


<button id="closeLeader">
❌ CLOSE
</button>

</div>





<audio id="jumpSound" src="audio.mp3" preload="auto"></audio>



<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
import {
    getDatabase,
    ref,
    push,
    onValue
} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-database.js";

const firebaseConfig = {
    apiKey: "AIzaSyC2NVy5uCfbBMXE0KfzHRnFPAzlNTB6hUE",
    authDomain: "dweu-jumpii.firebaseapp.com",
    databaseURL: "https://dweu-jumpii-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "dweu-jumpii",
    storageBucket: "dweu-jumpii.firebasestorage.app",
    messagingSenderId: "166188949350",
    appId: "1:166188949350:web:a3bf3bf442faa68d6032a7"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// ======================================
// ELEMENTS
// ======================================

const player = document.getElementById("player");
const obs = document.getElementById("obs");
const obs2 = document.getElementById("obs2");

const scoreText = document.getElementById("score");
const highText = document.getElementById("highScore");
const coinText = document.getElementById("coins");

const startMenu = document.getElementById("startMenu");
const message = document.getElementById("msg");
const newRecord = document.getElementById("newRecord");

const playerNameInput = document.getElementById("playerName");
const startBtn = document.getElementById("startBtn");
const restartBtn = document.getElementById("restartBtn");
const closeMsg = document.getElementById("closeMsg");
const pauseBtn = document.getElementById("pauseBtn");

const skinMenu = document.getElementById("skinMenu");
const bgMenu = document.getElementById("bgMenu");
const leaderMenu = document.getElementById("leaderMenu");
const leaderList = document.getElementById("leaderList");

const jumpSound = document.getElementById("jumpSound");

// ======================================
// GAME STATE
// ======================================

let score = 0;
let highScore = Number(localStorage.getItem("highScore")) || 0;
let coins = Number(localStorage.getItem("coins")) || 0;

let jumping = false;
let gameRunning = false;
let started = false;
let paused = false;

let obstacleX = window.innerWidth;
let secondObstacleOffset = 0;
let obstaclePattern = "single";
let speed = 9;
let animationStarted = false;
let scoreInterval = null;

highText.textContent = highScore;
coinText.textContent = coins;

// ======================================
// LOAD SAVED SETTINGS
// ======================================

const savedSkin = localStorage.getItem("skin");
if (savedSkin) {
    player.src = savedSkin;
}

const savedBg = localStorage.getItem("background");
setBackground(savedBg || "bg.jpg");

const savedName = localStorage.getItem("playerName");
if (savedName) {
    playerNameInput.value = savedName;
}

playerNameInput.addEventListener("input", () => {
    localStorage.setItem("playerName", playerNameInput.value);
});

function setBackground(fileName) {
    document.body.style.background =
        `url("${fileName}") center/cover no-repeat`;
}

// ======================================
// SCORE
// ======================================

function startScoreTimer() {
    clearInterval(scoreInterval);

    scoreInterval = setInterval(() => {
        if (!started || !gameRunning || paused) return;

        score += 1;

        if (score > 0 && score % 100 === 0 && speed < 20) {
            speed += 0.5;
        }

        scoreText.textContent = score;

        if (score > highScore) {
            highScore = score;
            highText.textContent = highScore;
            localStorage.setItem("highScore", String(highScore));
        }
    }, 500);
}

// ======================================
// JUMP
// ======================================

function jump() {
    if (jumping || !gameRunning || paused) return;

    jumping = true;

    jumpSound.currentTime = 0;
    jumpSound.play().catch(() => {});

    let height = 0;

    const up = setInterval(() => {
        if (!gameRunning) {
            clearInterval(up);
            jumping = false;
            return;
        }

        if (paused) return;

        height += 8;
        player.style.bottom = `${40 + height}px`;

        if (height >= 220) {
            clearInterval(up);

            const down = setInterval(() => {
                if (!gameRunning) {
                    clearInterval(down);
                    player.style.bottom = "40px";
                    jumping = false;
                    return;
                }

                if (paused) return;

                height -= 8;
                player.style.bottom = `${40 + height}px`;

                if (height <= 0) {
                    clearInterval(down);
                    player.style.bottom = "40px";
                    jumping = false;
                }
            }, 20);
        }
    }, 20);
}

document.addEventListener("touchstart", event => {
    if (!event.target.closest("button, input, .popup")) {
        event.preventDefault();
        jump();
    }
}, { passive: false });

document.addEventListener("mousedown", event => {
    if (!event.target.closest("button, input, .popup")) {
        jump();
    }
});

document.addEventListener("keydown", event => {
    if (event.code === "Space" || event.code === "ArrowUp") {
        event.preventDefault();
        jump();
    }
});

// ======================================
// ONE RANDOMIZED OBSTACLE
// ======================================

function setRandomObstacle() {
    obs.src = "hy.png";
    obs2.src = "hy.png";

    // Random interval before the next obstacle group.
    const minGap = Math.max(320, window.innerWidth * 0.28);
    const maxGap = Math.max(850, window.innerWidth * 0.80);
    const randomGap = minGap + Math.random() * (maxGap - minGap);

    obstacleX = window.innerWidth + randomGap;

    // Randomly choose a pattern. This is NOT based on score.
    const chance = Math.random();

    if (chance < 0.70) {
        // 70%: one obstacle
        obstaclePattern = "single";
        secondObstacleOffset = 0;
        obs2.style.display = "none";
    } else if (chance < 0.90) {
        // 20%: two close obstacles
        obstaclePattern = "close";
        secondObstacleOffset = 105 + Math.random() * 40;
        obs2.style.display = "block";
    } else {
        // 10%: two far obstacles
        obstaclePattern = "far";
        secondObstacleOffset = 230 + Math.random() * 100;
        obs2.style.display = "block";
    }

    // Random size for each cactus.
    const mobile = window.innerWidth <= 700;
    const minWidth = mobile ? 68 : 82;
    const maxWidth = mobile ? 100 : 125;

    const firstWidth = minWidth + Math.random() * (maxWidth - minWidth);
    const secondWidth = minWidth + Math.random() * (maxWidth - minWidth);

    obs.style.width = `${Math.round(firstWidth)}px`;
    obs2.style.width = `${Math.round(secondWidth)}px`;

    obs.style.bottom = "40px";
    obs2.style.bottom = "40px";

    obs.style.left = `${obstacleX}px`;
    obs2.style.left = `${obstacleX + secondObstacleOffset}px`;
}

// ======================================
// OBSTACLE MOVEMENT
// ======================================

function moveObstacle() {
    if (!animationStarted) return;

    if (gameRunning && !paused) {
        obstacleX -= speed;

        obs.style.left = `${obstacleX}px`;

        if (obstaclePattern !== "single") {
            obs2.style.left = `${obstacleX + secondObstacleOffset}px`;
        }

        const lastObstacleX =
            obstaclePattern === "single"
                ? obstacleX
                : obstacleX + secondObstacleOffset;

        if (lastObstacleX < -150) {
            setRandomObstacle();

            coins += 1;
            coinText.textContent = coins;
            localStorage.setItem("coins", String(coins));
        }

        checkCollision();
    }

    requestAnimationFrame(moveObstacle);
}

function startAnimationLoop() {
    if (animationStarted) return;
    animationStarted = true;
    requestAnimationFrame(moveObstacle);
}

// ======================================
// COLLISION
// ======================================

function rectanglesOverlap(a, b) {
    return (
        a.left < b.right &&
        a.right > b.left &&
        a.bottom > b.top &&
        a.top < b.bottom
    );
}

function getObstacleBox(element) {
    const rect = element.getBoundingClientRect();

    return {
        left: rect.left + 15,
        right: rect.right - 15,
        top: rect.top + 15,
        bottom: rect.bottom - 5
    };
}

function checkCollision() {
    const p = player.getBoundingClientRect();

    const playerBox = {
        left: p.left + 25,
        right: p.right - 25,
        top: p.top + 20,
        bottom: p.bottom - 10
    };

    const hitFirst = rectanglesOverlap(
        playerBox,
        getObstacleBox(obs)
    );

    let hitSecond = false;

    if (obstaclePattern !== "single" && obs2.style.display !== "none") {
        hitSecond = rectanglesOverlap(
            playerBox,
            getObstacleBox(obs2)
        );
    }

    if (hitFirst || hitSecond) {
        gameOver();
    }
}

// ======================================
// FIREBASE
// ======================================

function saveScore() {
    const name = playerNameInput.value.trim() || "Anonymous";

    push(ref(db, "leaderboard"), {
        name,
        score,
        date: Date.now()
    }).catch(error => {
        console.error("Could not save score:", error);
    });
}

function loadLeaderboard() {
    leaderList.textContent = "Loading...";

    onValue(
        ref(db, "leaderboard"),
        snapshot => {
            const players = [];

            snapshot.forEach(child => {
                players.push(child.val());
            });

            players.sort((a, b) => Number(b.score) - Number(a.score));

            leaderList.innerHTML = "";

            if (players.length === 0) {
                leaderList.textContent = "No scores yet.";
                return;
            }

            players.slice(0, 10).forEach((entry, index) => {
                const row = document.createElement("p");
                row.textContent =
                    `${index + 1}. ${entry.name || "Anonymous"} ⭐ ${Number(entry.score) || 0}`;
                leaderList.appendChild(row);
            });
        },
        error => {
            console.error("Could not load leaderboard:", error);
            leaderList.textContent = "Unable to load leaderboard.";
        },
        { onlyOnce: true }
    );
}

// ======================================
// GAME OVER
// ======================================

function gameOver() {
    if (!gameRunning) return;

    gameRunning = false;
    paused = false;
    pauseBtn.textContent = "⏸";

    const isNewRecord = score > 0 && score >= highScore;
    newRecord.style.display = isNewRecord ? "block" : "none";

    message.style.display = "flex";
    saveScore();
}

// ======================================
// START / RESTART / MENU
// ======================================

function resetRound() {
    score = 0;
    speed = 9;
    paused = false;
    jumping = false;

    scoreText.textContent = "0";
    pauseBtn.textContent = "⏸";

    setRandomObstacle();
    obs.style.left = `${obstacleX}px`;
    obs2.style.left = `${obstacleX + secondObstacleOffset}px`;
    player.style.bottom = "40px";

    newRecord.style.display = "none";
}

function beginGame() {
    const name = playerNameInput.value.trim();

    if (!name) {
        alert("⚠️ Please enter your name first!");
        return;
    }

    localStorage.setItem("playerName", name);

    resetRound();

    started = true;
    gameRunning = true;

    startMenu.style.display = "none";
    message.style.display = "none";

    startScoreTimer();
    startAnimationLoop();
}

startBtn.addEventListener("click", event => {
    event.stopPropagation();
    beginGame();
});

restartBtn.addEventListener("click", event => {
    event.stopPropagation();
    beginGame();
});

closeMsg.addEventListener("click", event => {
    event.stopPropagation();

    gameRunning = false;
    started = false;
    clearInterval(scoreInterval);

    resetRound();

    message.style.display = "none";
    startMenu.style.display = "flex";

    const background = localStorage.getItem("background") || "bg.jpg";
    setBackground(background);
});

// ======================================
// PAUSE
// ======================================

pauseBtn.addEventListener("click", event => {
    event.stopPropagation();

    if (!gameRunning) return;

    paused = !paused;
    pauseBtn.textContent = paused ? "▶️" : "⏸️";
});

// ======================================
// POPUPS
// ======================================

function closeAllPopups() {
    document.querySelectorAll(".popup").forEach(popup => {
        popup.style.display = "none";
    });
}

document.getElementById("startSkinBtn").addEventListener("click", event => {
    event.stopPropagation();
    closeAllPopups();
    skinMenu.style.display = "block";
});

document.getElementById("startBgBtn").addEventListener("click", event => {
    event.stopPropagation();
    closeAllPopups();
    bgMenu.style.display = "block";
});

document.getElementById("leaderBtn").addEventListener("click", event => {
    event.stopPropagation();
    closeAllPopups();
    leaderMenu.style.display = "block";
    loadLeaderboard();
});

document.getElementById("closeLeader").addEventListener("click", event => {
    event.stopPropagation();
    leaderMenu.style.display = "none";
});

document.addEventListener("click", event => {
    if (
        !event.target.closest(".popup") &&
        !event.target.closest("#startSkinBtn") &&
        !event.target.closest("#startBgBtn") &&
        !event.target.closest("#leaderBtn")
    ) {
        closeAllPopups();
    }
});

// ======================================
// SKINS AND BACKGROUNDS
// ======================================

document.querySelectorAll("#skinMenu .item").forEach(item => {
    item.addEventListener("click", event => {
        event.stopPropagation();

        const skin = item.dataset.skin;
        player.src = skin;
        localStorage.setItem("skin", skin);
        skinMenu.style.display = "none";
    });
});

document.querySelectorAll("#bgMenu .item").forEach(item => {
    item.addEventListener("click", event => {
        event.stopPropagation();

        const background = item.dataset.bg;
        setBackground(background);
        localStorage.setItem("background", background);
        bgMenu.style.display = "none";
    });
});

// Keep the obstacle correctly positioned after rotation or resize.
window.addEventListener("resize", () => {
    if (!gameRunning) {
        setRandomObstacle();
        obs.style.left = `${obstacleX}px`;
        obs2.style.left = `${obstacleX + secondObstacleOffset}px`;
    }
});
</script>

</div>
</body>
</html>
