<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rabbit Rush Racing v2 🐰</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#222;
    font-family:Arial;
}


#game{
    width:360px;
    height:600px;
    overflow:hidden;
    position:relative;
    border:5px solid white;
    border-radius:20px;
    background:#6bcf4d;
}


#road{
    position:absolute;
    left:70px;
    width:220px;
    height:100%;
    background:#555;
}


.roadLine{
    position:absolute;
    width:10px;
    height:80px;
    background:white;
    left:175px;
}


#forest{
    position:absolute;
    width:100%;
    height:100%;
}


.tree{
    position:absolute;
    font-size:40px;
}


#ui{
    position:absolute;
    top:10px;
    left:10px;
    z-index:10;
    background:white;
    padding:10px;
    border-radius:15px;
}


#rabbit{
    position:absolute;
    bottom:50px;
    left:150px;
    font-size:55px;
}


.jump{
    animation:hop .3s infinite alternate;
}


@keyframes hop{

from{
transform:translateY(0);
}

to{
transform:translateY(-8px);
}

}


.item{
    position:absolute;
    font-size:35px;
}


#controls{
    position:absolute;
    bottom:10px;
    width:100%;
    display:flex;
    justify-content:space-around;
    z-index:20;
}


button{
    font-size:28px;
    padding:10px 25px;
    border-radius:15px;
    border:0;
}


#menu,
#gameOver{

position:absolute;
inset:0;
background:rgba(0,0,0,.8);
color:white;
z-index:50;
text-align:center;
padding-top:180px;

}


#gameOver{
display:none;
}



</style>
</head>


<body>


<div id="game">


<div id="forest"></div>


<div id="road"></div>


<div class="roadLine" style="top:0"></div>
<div class="roadLine" style="top:150px"></div>
<div class="roadLine" style="top:300px"></div>
<div class="roadLine" style="top:450px"></div>


<div id="ui">
🥕 <span id="score">0</span>
<br>
❤️ <span id="life">3</span>
<br>
🏆 <span id="high">0</span>
</div>


<div id="rabbit" class="jump">
🐰
</div>


<div id="controls">

<button onclick="left()">⬅️</button>

<button onclick="right()">➡️</button>

</div>



<div id="menu">

<h1>🐰 Rabbit Rush</h1>

<p>Collect carrots and avoid trees!</p>

<button onclick="start()">START</button>

</div>



<div id="gameOver">

<h1>GAME OVER</h1>

<p>
Score:
<span id="final"></span>
</p>

<button onclick="location.reload()">
Restart 🔄
</button>

</div>


</div>



<script>


let rabbit=document.getElementById("rabbit");

let x=150;

let score=0;

let lives=3;

let speed=5;

let playing=false;

let shield=false;


let high=
localStorage.getItem("rabbitHigh")||0;

document.getElementById("high").innerHTML=high;



function start(){

document.getElementById("menu").style.display="none";

playing=true;

spawn();

}



function left(){

if(x>80){
x-=40;
rabbit.style.left=x+"px";
}

}


function right(){

if(x<240){
x+=40;
rabbit.style.left=x+"px";
}

}



document.addEventListener("keydown",e=>{

if(e.key=="ArrowLeft")left();

if(e.key=="ArrowRight")right();

});





function spawn(){


if(!playing)return;


let obj=document.createElement("div");

obj.className="item";


let chance=Math.random();


if(chance<0.55)
obj.innerHTML="🥕";

else if(chance<0.8)
obj.innerHTML="🌳";

else if(chance<0.9)
obj.innerHTML="⚡";

else
obj.innerHTML="🛡️";



obj.style.left=(90+Math.random()*120)+"px";

obj.style.top="-50px";


document.getElementById("game").appendChild(obj);



let fall=setInterval(()=>{


let y=parseInt(obj.style.top);

y+=speed;

obj.style.top=y+"px";



let r=rabbit.getBoundingClientRect();

let o=obj.getBoundingClientRect();



if(
r.left<o.right &&
r.right>o.left &&
r.top<o.bottom &&
r.bottom>o.top
){


if(obj.innerHTML=="🥕"){

score+=10;

}


else if(obj.innerHTML=="⚡"){

speed+=2;

}


else if(obj.innerHTML=="🛡️"){

shield=true;

}


else if(obj.innerHTML=="🌳"){


if(shield){

shield=false;

}

else{

lives--;

document.getElementById("life").innerHTML=lives;


if(lives<=0){

end();

}

}


}



document.getElementById("score").innerHTML=score;

obj.remove();

clearInterval(fall);


}



if(y>650){

obj.remove();

clearInterval(fall);

}



},30);



setTimeout(spawn,800);


}




function end(){

playing=false;


if(score>high){

localStorage.setItem("rabbitHigh",score);

}


document.getElementById("final").innerHTML=score;

document.getElementById("gameOver").style.display="block";


}



setInterval(()=>{

if(playing){

speed+=0.05;

}

},1000);



</script>


</body>
</html>
